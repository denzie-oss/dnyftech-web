<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dnyftech</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 0 auto; padding: 16px; background: #0f1115; color: #eee; }
    input { width: 100%; padding: 12px; margin-bottom: 8px; font-size: 16px; border-radius: 8px; border: 1px solid #333; background: #1a1d24; color: #eee; box-sizing: border-box; }
    button { padding: 10px 14px; font-size: 15px; border: 0; border-radius: 8px; background: #f6821f; color: #000; font-weight: 600; }
    #add { width: 100%; margin-bottom: 16px; padding: 12px; font-size: 16px; }
    li { background: #1a1d24; padding: 10px; border-radius: 8px; margin-bottom: 8px; list-style: none; }
    small { color: #888; display: block; margin: 4px 0 8px; }
    .row button { background: #333; color: #eee; margin-right: 8px; }
    ul { padding: 0; }
  </style>
</head>
<body>
  <h1>dnyftech</h1>
  <input id="pw" type="password" placeholder="Password (to save, edit, delete)">
  <input id="text" placeholder="Write a note..." maxlength="500">
  <button id="add">Save note</button>
  <ul id="list"></ul>
  <script>
    const API = "https://api.dnyflab.workers.dev/api/notes";
    const $ = (id) => document.getElementById(id);
    $("pw").value = localStorage.getItem("pw") || "";
    $("pw").onchange = () => localStorage.setItem("pw", $("pw").value);

    async function call(url, method, body) {
      const res = await fetch(url, {
        method,
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + $("pw").value },
        body: body ? JSON.stringify(body) : undefined,
      });
      if (res.status === 401) alert("Wrong or missing password");
      return res.ok;
    }

    async function load() {
      try {
        const notes = await (await fetch(API)).json();
        $("list").innerHTML = "";
        for (const n of notes) {
          const li = document.createElement("li");
          const t = document.createElement("div");
          t.textContent = n.text;
          const s = document.createElement("small");
          s.textContent = n.created_at;
          const row = document.createElement("div");
          row.className = "row";
          const edit = document.createElement("button");
          edit.textContent = "Edit";
          edit.onclick = async () => {
            const v = prompt("Edit note", n.text);
            if (v && (await call(API + "/" + n.id, "PUT", { text: v }))) load();
          };
          const del = document.createElement("button");
          del.textContent = "Delete";
          del.onclick = async () => {
            if (confirm("Delete this note?") && (await call(API + "/" + n.id, "DELETE"))) load();
          };
          row.append(edit, del);
          li.append(t, s, row);
          $("list").appendChild(li);
        }
      } catch (e) {
        $("list").textContent = "Error: " + e;
      }
    }

    $("add").onclick = async () => {
      const text = $("text").value.trim();
      if (text && (await call(API, "POST", { text }))) {
        $("text").value = "";
        load();
      }
    };
    load();
  </script>
</body>
</html>
